  <circle cx="64" cy="30" r="13" fill="#5DBB46"/>
  <circle cx="36" cy="30" r="10" fill="#FFFFFF"/>
  <circle cx="64" cy="30" r="10" fill="#FFFFFF"/>
  <!-- Pupils -->
  <circle cx="38" cy="28" r="5" fill="#151922"/>
